<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amarok SE</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Amarok SE</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/amarok capa.jpeg" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/amarok capa.jpeg')">
                    <img src="new var/amarok v1.jpeg" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/amarok v1.jpeg')">
                    <img src="new var/amarok v2.jpeg" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/amarok v2.jpeg')">
                    <img src="new var/amarok v3.jpeg" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/amarok v3.jpeg')">
                    <img src="new var/amarok v4.jpeg" alt="Imagem 5" class="thumbnail" onclick="changeImage('new var/amarok v4.jpeg')">
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="new Capas/amarok capa.jpeg" alt="Volkswagen Amarok SE">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Volkswagen
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Amarok SE
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2018
                </div>
                <div class="info-item">
                    <strong>Quilometragem:</strong> 120.000
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Tração:</strong> 4x4
                </div>
                <div class="info-item">
                    <strong>Transmissão:</strong> Manual
                </div>
                <div class="info-item">
                    <strong>Combustível:</strong> Diesel
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 115.000,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
