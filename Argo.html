<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argo</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Argo</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <!-- Barra de imagens à esquerda -->
                <div class="thumbnail-bar">
                    <img src="carros/Argo Ed.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('carros/Argo Ed.png')">
                    <img src="Variantes/Argo 1.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('Variantes/Argo 1.png')">
                    <img src="Variantes/Argo 2.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/Argo 2.png')">
                    <img src="Variantes/Argo 3.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/Argo 3.png')">
                    <!-- Adicione mais miniaturas conforme necessário -->
                </div>
                
                <div class="image-zoom-container">  
                <div class="main-image">
                    <img id="main-img" src="carros/Argo Ed.png" alt="Ford Mustang">
                   
                </div>
            </div>
            </div>


            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Ford
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Mustang GT
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2023
                </div>
                <div class="info-item">
                    <strong>Quilometragem:</strong> 30.000
                </div>
                <div class="info-item">
                    <strong>Ar condicionado:</strong> Sim
                </div>
                <div class="info-item">
                    <strong>Câmbio Automático:</strong> Sim
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica:</strong> Sim
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 400.000
                </div>
            </div>
            
            <button class="contact-button">
        <a href="https://wa.me/554299814212" target="_blank">Entre em contato</a></button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
        
    </script>
    
</body>
</html>
