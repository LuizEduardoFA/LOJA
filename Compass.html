<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Compass</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <!-- Barra de imagens à esquerda -->
                <div class="thumbnail-bar">
                    <img src="carros/Jeep Compass Ed.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('carros/Jeep Compass Ed.png')">
                    <img src="Variantes/Jeep Compass 1.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('Variantes/Jeep Compass 1.png')">
                    <img src="Variantes/Jeep Compass 2.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/Jeep Compass 2.png')">
                    <img src="Variantes/Jeep Compass 3.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/Jeep Compass 3.png')">
                    <!-- Adicione mais miniaturas conforme necessário -->
                </div>
                
                <div class="image-zoom-container">  
                <div class="main-image">
                    <img id="main-img" src="carros/Jeep Compass Ed.png" alt="Ford Mustang">
                   
                </div>
            </div>
            </div>


            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Jeep
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Compass TrailHawk 4x4
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2020
                </div>
                <div class="info-item">
                    <strong>Quilometragem:</strong> 130.000
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 130.000
                </div>
            </div>
            
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
        
    </script>
    
</body>
</html>
