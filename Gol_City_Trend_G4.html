<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gol City Trend G4</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Gol City Trend G4</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="caminho/para/imagem1.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('caminho/para/imagem1.png')">
                    <img src="caminho/para/imagem2.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('caminho/para/imagem2.png')">
                    <img src="caminho/para/imagem3.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('caminho/para/imagem3.png')">
                    <img src="caminho/para/imagem4.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('caminho/para/imagem4.png')">
                    <img src="caminho/para/imagem5.png" alt="Imagem 5" class="thumbnail" onclick="changeImage('caminho/para/imagem5.png')">
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="caminho/para/imagem1.png" alt="Volkswagen Gol City Trend G4">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Volkswagen
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Gol City Trend G4
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2013
                </div>
                <div class="info-item">
                    <strong>Quilometragem:</strong> 76.000
                </div>
                <div class="info-item">
                    <strong>Status:</strong> Básico
                </div>
                <div class="info-item">
                    <strong>Proprietário:</strong> Segundo Dono
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 31.500,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
