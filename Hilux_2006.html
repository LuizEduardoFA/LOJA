<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilux</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Hilux</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="caminho/para/imagem1.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('caminho/para/imagem1.png')">
                    <img src="caminho/para/imagem2.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('caminho/para/imagem2.png')">
                    <img src="caminho/para/imagem3.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('caminho/para/imagem3.png')">
                    <img src="caminho/para/imagem4.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('caminho/para/imagem4.png')">
                    <img src="caminho/para/imagem5.png" alt="Imagem 5" class="thumbnail" onclick="changeImage('caminho/para/imagem5.png')">
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="caminho/para/imagem1.png" alt="Toyota Hilux">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Toyota
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Hilux
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2006
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Tração:</strong> 4x4
                </div>
                <div class="info-item">
                    <strong>Combustível:</strong> Diesel
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 84.000,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
