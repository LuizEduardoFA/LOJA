<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeep Renegade</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Jeep Renegade</h1>
        <a href="index.html">Voltar para o Catálogo</a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <!-- Barra de imagens à esquerda -->
                <div class="thumbnail-bar">
                    <img src="carros/Amarok Cinza Ed.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('images/ford-mustang-1.jpg')">
                    <img src="carros/Argo Ed.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('images/ford-mustang-2.jpg')">
                    <img src="carros/Gol Branco Ed.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('images/ford-mustang-3.jpg')">
                    <!-- Adicione mais miniaturas conforme necessário -->
                </div>
                
                <!-- Imagem principal do carro -->
                <div class="main-image">
                    <img id="main-img" src="carros/Jeep renegade Ed.png" alt="Ford Mustang">
                </div>
            </div>


            <p id="car-description">Jeep renegade Sinistrado, em bom estado e num sei o que lá.</p>
            <ul id="car-specs">
                <li>Marca: <span id="car-brand">Jeep</span></li>
                <li>Modelo: <span id="car-model">Renegade</span></li>
                <li>Ano: <span id="car-year">2016</span></li>
                <li>Preço: <span id="car-price">75.000</span></li>
            </ul>
            <button class="contact-button"><a href="https://wa.me/554299814212" target="_blank">Entre em contato</a></button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
    </footer>
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
