<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ka Sedan SE</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Ka Sedan SE</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/ka capa new.jpeg" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/ka capa new.jpeg')">
                    <img src="new var/ka interna new.jpeg" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/ka interna new.jpeg')">
                    <img src="new var/ka traseira new.jpeg" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/ka traseira new.jpeg')">
                    <img src="new var/ka lateral new.jpeg " alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/ka lateral new.jpeg ')">
                   
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="new Capas/ka capa new.jpeg" alt="Ford Ka Sedan SE">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Ford
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Ka Sedan SE
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2019
                </div>
                <div class="info-item">
                    <strong>Quilometragem:</strong> 77.000
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Motor:</strong> 1.0
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 49.900,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
