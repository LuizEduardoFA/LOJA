<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montana LS</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Montana LS</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/Montana F.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/Montana F.png')">
                    <img src="new var/Montana L.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/Montana L.png')">
                    <img src="new var/Montana I.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/Montana I.png')">
                    <img src="new var/Montana T.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/Montana T.png')">
                </div>
                <div class="image-zoom-container">  
                    <div class="main-image">
                        <img id="main-img" src="new Capas/Montana F.png" alt="Montana LS">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item"><strong>Marca:</strong> Chevrolet</div>
                <div class="info-item"><strong>Modelo:</strong> Montana LS</div>
                <div class="info-item"><strong>Ano:</strong> 2017</div>
                <div class="info-item"><strong>Cor:</strong> Branco</div>
                <div class="info-item"><strong>Motor:</strong> 1.4</div>
                <div class="info-item"><strong>Configuração:</strong> Completo</div>
                <div class="info-item"><strong>Preço:</strong> R$ 49,900.00</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    <script>
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
