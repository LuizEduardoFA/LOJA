<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger XLT</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Ranger XLT</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/RES adjust.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/RES adjust.png')">
                    <img src="new var/rgr v1.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/rgr v1.png')">
                    <img src="new var/rgr v2.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/rgr v2.png')">
                    <img src="new var/rgr v3.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/rgr v3.png')">
                    <img src="new var/rgr v4.png" alt="Imagem 5" class="thumbnail" onclick="changeImage('new var/rgr v4.png')">
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="new Capas/RES adjust.png" alt="Ford Ranger XLT">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Ford
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Ranger XLT
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2017
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Tração:</strong> 4x4
                </div>
                <div class="info-item">
                    <strong>Transmissão:</strong> Automática
                </div>
                <div class="info-item">
                    <strong>Combustível:</strong> Diesel
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 130.000,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
