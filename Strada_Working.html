<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strada Working</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Strada Working</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/Strada capa.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/Strada capa.png')">
                    <img src="new var/Strada v1.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/Strada v1.png')">
                    <img src="new var/Strada v2.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/Strada v2.png')">
                    <img src="new var/Strada v3.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/Strada v3.png')">
                    <img src="new var/Strada v4.png" alt="Imagem 5" class="thumbnail" onclick="changeImage('new var/Strada v4.png')">
                </div>
                
                <div class="image-zoom-container"> 
                    <div class="main-image">
                        <img id="main-img" src="new Capas/Strada capa.png" alt="Fiat Strada Working">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item">
                    <strong>Marca:</strong> Fiat
                </div>
                <div class="info-item">
                    <strong>Modelo:</strong> Strada Working 1.4
                </div>
                <div class="info-item">
                    <strong>Ano:</strong> 2014
                </div>
                <div class="info-item">
                    <strong>Ar condicionado</strong> 
                </div>
                <div class="info-item">
                    <strong>Direção Hidráulica</strong>
                </div>
                <div class="info-item">
                    <strong>Vidro Elétrico</strong> 
                </div>
                <div class="info-item">
                    <strong>Trava Elétrica</strong>
                </div>
                <div class="info-item">
                    <strong>Motor:</strong> 1.4
                </div>
                <div class="info-item">
                    <strong>Preço:</strong> R$ 47.000,00
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    
    <script>
        // Função para mudar a imagem principal ao clicar nas miniaturas
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
    
</body>
</html>
