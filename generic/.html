<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARRETA REBOQUE </title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>CARRETA REBOQUE </h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/CARRETA.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/CARRETA.png')">
                    <img src="new var/CARRETA F.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/CARRETA F.png')">
                    <img src="new var/CARRETA i.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/CARRETA i.png')">
                    <img src="new var/CARRETA T.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/CARRETA T.png')">
                </div>
                <div class="image-zoom-container">  
                    <div class="main-image">
                        <img id="main-img" src="new Capas/CARRETA.png" alt="CARRETA REBOQUE ">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item"><strong>Marca:</strong> ----------------------</div>
                <div class="info-item"><strong>Modelo:</strong> CARRETA REBOQUE </div>
                <div class="info-item"><strong>Ano:</strong> 2024</div>
                <div class="info-item"><strong>Cor:</strong> ----------------</div>
                <div class="info-item"><strong>Motor:</strong> ---------------------</div>
                <div class="info-item"><strong>Configuração:</strong> ------------------------</div>
                <div class="info-item"><strong>Preço:</strong> R$ 9,500.00</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    <script>
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
