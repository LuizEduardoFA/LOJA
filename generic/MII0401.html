<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandero </title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Sandero </h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/Sandero.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/Sandero.png')">
                    <img src="new var/Sandero F.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/Sandero F.png')">
                    <img src="new var/Sandero i.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/Sandero i.png')">
                    <img src="new var/Sandero T.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/Sandero T.png')">
                </div>
                <div class="image-zoom-container">  
                    <div class="main-image">
                        <img id="main-img" src="new Capas/Sandero.png" alt="Sandero ">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item"><strong>Marca:</strong> Renault</div>
                <div class="info-item"><strong>Modelo:</strong> Sandero </div>
                <div class="info-item"><strong>Ano:</strong> 2011</div>
                <div class="info-item"><strong>Cor:</strong> Verde</div>
                <div class="info-item"><strong>Motor:</strong> 1.0</div>
                <div class="info-item"><strong>Configuração:</strong> Completo</div>
                <div class="info-item"><strong>Preço:</strong> R$ 26,800.00</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    <script>
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
