<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Economy</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>UNO Economy</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <<img src="new Capas/UNO F" alt="Imagem 1" class="thumbnail" onclick="changeImage('carros/HB20 branco Ed.png')">
                    <img src="Variantes/HB20 1.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('Variantes/HB20 1.png')">
                    <img src="Variantes/HB20 2.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/HB20 2.png')">
                    <img src="Variantes/HB20 3.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('Variantes/HB20 3.png')">
                </div>
                <div class="image-zoom-container">  
                    <div class="main-image">
                        <img id="main-img" src="new Capas/UNO.png" alt="UNO Economy">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item"><strong>Marca:</strong> FIAT</div>
                <div class="info-item"><strong>Modelo:</strong> UNO Economy</div>
                <div class="info-item"><strong>Ano:</strong> 2011</div>
                <div class="info-item"><strong>Cor:</strong> Branco</div>
                <div class="info-item"><strong>Motor:</strong> 1.0</div>
                <div class="info-item"><strong>Configuração:</strong> Básico</div>
                <div class="info-item"><strong>Preço:</strong> R$ 22,500.00</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    <script>
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
