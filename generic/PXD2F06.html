<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palio Flex</title>
    <link rel="stylesheet" href="desc.css">
</head>
<body>
    <header>
        <h1>Palio Flex</h1>
        <a href="index.html" class="back-link">
            <span class="back-icon">←</span> Voltar para o catálogo
        </a>
    </header>
    <main>
        <section class="car-details">

            <div class="image-container">
                <div class="thumbnail-bar">
                    <img src="new Capas/Palio.png" alt="Imagem 1" class="thumbnail" onclick="changeImage('new Capas/Palio.png')">
                    <img src="new var/Palio F.png" alt="Imagem 2" class="thumbnail" onclick="changeImage('new var/Palio F.png')">
                    <img src="new var/Palio i.png" alt="Imagem 3" class="thumbnail" onclick="changeImage('new var/Palio i.png')">
                    <img src="new var/Palio T.png" alt="Imagem 4" class="thumbnail" onclick="changeImage('new var/Palio T.png')">
                </div>
                <div class="image-zoom-container">  
                    <div class="main-image">
                        <img id="main-img" src="new Capas/Palio.png" alt="Palio Flex">
                    </div>
                </div>
            </div>

            <div class="car-info">
                <div class="info-item"><strong>Marca:</strong> FIAT</div>
                <div class="info-item"><strong>Modelo:</strong> Palio Flex</div>
                <div class="info-item"><strong>Ano:</strong> 2016</div>
                <div class="info-item"><strong>Cor:</strong> Prata</div>
                <div class="info-item"><strong>Motor:</strong> 1.4</div>
                <div class="info-item"><strong>Configuração:</strong> Completo</div>
                <div class="info-item"><strong>Preço:</strong> R$ 42,000.00</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Veneza Multimarcas</p>
        <p>&copy; 2025 - LuizEduardoFA</p>
    </footer>
    <script>
        function changeImage(src) {
            document.getElementById('main-img').src = src;
        }
    </script>
</body>
</html>
